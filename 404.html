<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/js/config.js"></script>
  <script src="/js/seo-injector.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/headerfooter.css" />
  <link rel="stylesheet" href="/fonts/fontawesome/css/all.min.css" />
  <script>
    var PAGE_CONFIG = {
      title: 'Page Not Found',
      description: 'The page you are looking for could not be found. Browse the homepage or popular sections instead.',
    };
  </script>
  <style>
    .error-wrap { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem; }
    .error-card { max-width: 640px; width: 100%; text-align: center; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 3.5rem 2.5rem; box-shadow: var(--shadow); }
    .error-code { font-size: 7rem; font-weight: 900; line-height: 1; margin: 0; background: var(--gradient); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .error-title { font-size: 1.6rem; font-weight: 700; color: var(--text-primary); margin: 1rem 0 0.5rem; }
    .error-text { color: var(--text-secondary); font-size: 1rem; line-height: 1.7; margin: 0 0 2rem; }
    .error-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2.25rem; }
    .btn-primary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.75rem; background: var(--gradient); color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; transition: var(--transition); }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.75rem; background: transparent; color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; text-decoration: none; font-weight: 600; transition: var(--transition); }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    .error-links { border-top: 1px solid var(--border); padding-top: 1.75rem; }
    .error-links p { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin: 0 0 1rem; }
    .error-links a { display: inline-block; margin: 0.35rem 0.5rem; color: var(--accent); text-decoration: none; font-size: 0.95rem; }
    .error-links a:hover { text-decoration: underline; }
    @media (max-width: 480px) { .error-code { font-size: 5rem; } .error-card { padding: 2.5rem 1.5rem; } }
  </style>
</head>
<body>
  <div id="header"></div>
  <main class="error-wrap">
    <div class="error-card">
      <h1 class="error-code">404</h1>
      <h2 class="error-title">Page Not Found</h2>
      <p class="error-text">The page you're looking for has moved, been removed, or never existed. Let's get you back on track.</p>
      <div class="error-actions">
        <a href="/" class="btn-primary"><i class="fas fa-house"></i> Go Home</a>
        <a href="/contact" class="btn-secondary"><i class="fas fa-envelope"></i> Contact Us</a>
      </div>
      <div class="error-links">
        <p>Popular sections</p>
        <a href="/blog">Blog</a>
        <a href="/about">About</a>
        <a href="/contact#privacy">Privacy Policy</a>
        <a href="/contact#terms">Terms of Service</a>
      </div>
    </div>
  </main>
  <div id="footer"></div>
  <script src="/js/headerfooter.js" defer></script>
</body>
</html>
