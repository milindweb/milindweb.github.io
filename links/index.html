<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/config.js"></script>
<script>const PAGE_CONFIG = { title: 'Useful Links', description: 'Curated collection of tools, AI resources, games and utilities.', canonical: '/links' };</script>
<script src="/js/seo-injector.js"></script>
<title>MilindWeb - Useful Links</title>

<!-- Fonts & Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Header + Footer -->
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/headerfooter.css">
<link rel="stylesheet" href="/css/accordion.css">
<script src="/js/headerfooter.js" defer></script>

<style>
body {
  font-family:"Poppins",sans-serif;
  background:var(--secondary-bg);
  margin:0;
  padding:0;
  color:var(--text-primary);
}

.main-content {
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:2rem 1rem;
}

h2 {
  margin:1.5rem 0 1rem;
  color:var(--accent);
  text-align:left;
  width:100%;
  max-width:920px;
}

/* SEARCH */
.search-box {
  width:100%;
  max-width:920px;
  margin-bottom:1rem;
  display:flex;
  align-items:center;
  background:var(--card-bg);
  border-radius:var(--border-radius, 12px);
  border:1px solid var(--border);
  padding:0.6rem 1rem;
  box-shadow:var(--shadow);
}

.search-box i {
  color:var(--accent);
  margin-right:0.5rem;
}

.search-box input {
  border:none;
  outline:none;
  width:100%;
  font-size:0.95rem;
  font-family:"Poppins",sans-serif;
  background:transparent;
  color:var(--text-primary);
}

.container {
  width:100%;
  max-width:920px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));
  gap:0.9rem;
  align-items:start;
}

.container .acc {
  margin-bottom:0;
}

.loading,
.error {
  margin-top:2rem;
  font-size:1rem;
  color:var(--text-secondary);
}
</style>
</head>

<body>

<div id="header"></div>

<main class="main-content">

<h2>📁 Useful Links</h2>

<div class="search-box">
  <i class="fas fa-search"></i>
  <input type="text" id="searchInput" placeholder="Search tools, AI, games, utilities...">
</div>

<div id="links-container" class="container"></div>

<div id="statusMessage" class="loading">Loading data...</div>

</main>

<div id="footer"></div>

<script>
let linksData = [];
const container = document.getElementById("links-container");
const statusMessage = document.getElementById("statusMessage");

/* =============================
   FETCH JSON DATA
============================= */
async function loadData() {
  try {
    const response = await fetch("/data/links.json");

    if (!response.ok) {
      throw new Error("Failed to load JSON");
    }

    linksData = await response.json();
    statusMessage.style.display = "none";
    renderLinks();

  } catch (error) {
    statusMessage.className = "error";
    statusMessage.textContent = "❌ Error loading data. Check JSON path.";
    console.error(error);
  }
}

/* =============================
   RENDER FUNCTION
============================= */
function renderLinks(filterText = "") {
  container.innerHTML = "";
  const search = filterText.toLowerCase();
  const isSearching = filterText.trim() !== "";

  linksData.forEach(section => {

    const visibleItems = section.items.filter(item =>
      item.title.toLowerCase().includes(search) ||
      item.desc.toLowerCase().includes(search)
    );

    if (visibleItems.length === 0) return;

    const card = document.createElement("div");
    card.className = "acc acc-list";

    const header = document.createElement("div");
    header.className = "acc-header";

    const title = document.createElement("span");
    title.className = "acc-title";
    title.textContent = section.category;

    const toggle = document.createElement("i");
    toggle.className = "fas fa-chevron-down acc-toggle";

    header.appendChild(title);
    header.appendChild(toggle);

    const body = document.createElement("div");
    body.className = "acc-body";

    visibleItems.forEach(item => {
      const row = document.createElement("a");
      row.className = "acc-item";
      row.href = item.link;
      row.target = "_blank";

      row.innerHTML = `
        <i class="${item.icon}"></i>
        <span class="acc-item-info">
          <span class="acc-item-title">${item.title}</span>
          <span class="acc-item-desc">${item.desc}</span>
        </span>
        <i class="fas fa-arrow-right acc-item-arrow"></i>
      `;

      body.appendChild(row);
    });

    card.appendChild(header);
    card.appendChild(body);
    container.appendChild(card);

    header.addEventListener("click", function () {
      card.classList.toggle("open");
    });

    if (isSearching) {
      card.classList.add("open");
    }

  });
}

/* =============================
   SEARCH EVENT
============================= */
document.getElementById("searchInput").addEventListener("input", function () {
  renderLinks(this.value);
});

/* =============================
   INIT
============================= */
loadData();
</script>

</body>
</html>
