<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'Milindweb Search Portal', description: 'Search files and data from Google Drive or Google Sheets.', canonical: '/mp' };</script>
  <script src="js/seo-injector.js"></script>
  <title>Milindweb Search Portal</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/headerfooter.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="js/headerfooter.js" defer></script>
  <style>
    .mp-wrap { max-width: 1000px; margin: 40px auto; padding: 0 20px 60px; }
    .mp-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); }
    .mp-card h2 { font-size: 1.5rem; margin: 0 0 1.5rem; color: var(--text-primary); display: flex; align-items: center; gap: 10px; }
    .mp-card h2 i { color: var(--accent); }
    .hidden { display: none; }
    .mp-login label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; color: var(--text-primary); }
    .mp-login select, .mp-login input {
      width: 100%; padding: 0.65rem 0.8rem; font-size: 0.95rem;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--primary-bg); color: var(--text-primary); margin-bottom: 1rem;
    }
    .mp-login select:focus, .mp-login input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .mp-login .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .mp-login .row input[type="password"] { flex: 1; min-width: 180px; margin-bottom: 0; }
    .mp-login .row label { display: flex; align-items: center; gap: 6px; margin: 0; font-weight: 400; font-size: 0.85rem; cursor: pointer; }
    .mp-login .row label input { width: auto; margin: 0; }
    .btn-primary { padding: 0.7rem 1.5rem; font-weight: 600; color: #fff; background: var(--gradient); border: none; border-radius: 8px; cursor: pointer; transition: var(--transition); }
    .btn-primary:hover { opacity: 0.92; }
    .mp-search { display: flex; gap: 10px; margin-bottom: 1rem; }
    .mp-search input { flex: 1; padding: 0.7rem 0.85rem; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 8px; background: var(--primary-bg); color: var(--text-primary); }
    .mp-search input:focus { outline: none; border-color: var(--accent); }
    #suggestions { list-style: none; padding: 0; margin: 0 0 1rem; }
    #suggestions li { cursor: pointer; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 4px; background: var(--card-bg); color: var(--text-primary); font-size: 0.9rem; }
    #suggestions li:hover { background: var(--secondary-bg); }
    #loading { font-style: italic; color: var(--text-secondary); }
    #results { margin-top: 1.5rem; }
    .folder { cursor: pointer; margin: 6px 0; font-weight: 600; color: var(--accent); }
    .tree { margin-left: 20px; padding-left: 10px; border-left: 1px solid var(--border); }
    .file { margin: 4px 0; font-size: 0.9rem; color: var(--text-primary); }
    .file a { color: var(--accent); text-decoration: none; }
    .file a:hover { text-decoration: underline; }
    .highlight { background: #fef08a; color: #1e293b; padding: 0 2px; border-radius: 2px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; color: var(--text-primary); }
    th, td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; font-size: 0.9rem; }
    th { background: var(--secondary-bg); font-weight: 600; position: sticky; top: 0; }
    .mp-error { color: var(--danger, #dc3545); }
    @media (max-width: 480px) { .mp-search { flex-direction: column; } }
  </style>
</head>
<body>
  <div id="header"></div>
  <div class="mp-wrap">
    <div class="mp-card">
      <h2><i class="fas fa-search"></i> Milindweb Search Portal</h2>

      <div class="mp-login">
        <label for="source">Select Source</label>
        <select id="source">
          <option value="drive">Google Drive</option>
          <option value="sheet">Google Sheet</option>
        </select>
        <label for="password">Enter Password</label>
        <div class="row">
          <input type="password" id="password" placeholder="Enter Password">
          <label><input type="checkbox" onclick="togglePwd()"> Show Password</label>
          <button class="btn-primary" onclick="login()">Submit</button>
        </div>
      </div>

      <div id="searchBox" class="hidden">
        <div class="mp-search">
          <input type="text" id="search" placeholder="Search..." onkeyup="suggest()">
          <button class="btn-primary" onclick="performSearch()">Search</button>
        </div>
        <ul id="suggestions"></ul>
      </div>

      <div id="loading" class="hidden">Loading data, please wait...</div>
      <div id="results"></div>
    </div>
  </div>
  <div id="footer"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxSqnkHPwOd12v93JSvqGSoHQOWhao2r7-DRvXjflnAEHpT2qcXg11EHDIY1flJmCkW/exec";
    let currentSource = "";
    let currentKey = "";
    let fullData = null;

    function togglePwd() {
      const pwd = document.getElementById("password");
      pwd.type = pwd.type === "password" ? "text" : "password";
    }

    async function login() {
      currentSource = document.getElementById("source").value;
      currentKey = document.getElementById("password").value;
      document.getElementById("searchBox").classList.remove("hidden");
      await loadData(); // auto-load everything on login
    }

    async function loadData(query="") {
      document.getElementById("loading").classList.remove("hidden");
      document.getElementById("results").innerHTML = "";
      try {
        const res = await fetch(`${API_URL}?source=${currentSource}&key=${currentKey}&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        document.getElementById("loading").classList.add("hidden");
        if (data.error) {
          document.getElementById("results").innerHTML = `<p class="mp-error">${data.error}</p>`;
          return;
        }
        fullData = data;
        renderResults(data);
      } catch (err) {
        document.getElementById("loading").classList.add("hidden");
        document.getElementById("results").innerHTML = `<p class="mp-error">Error: ${err.message}</p>`;
      }
    }

    function performSearch() {
      const q = document.getElementById("search").value.toLowerCase();
      loadData(q);
    }

    function renderResults(data) {
      const container = document.getElementById("results");
      container.innerHTML = "";

      if (currentSource === "sheet") {
        if (!Array.isArray(data) || data.length === 0) { container.innerHTML = "<p>No results</p>"; return; }
        let table = "<table><thead><tr>";
        Object.keys(data[0]).forEach(h => table += `<th>${h}</th>`);
        table += "</tr></thead><tbody>";
        data.forEach(row => {
          table += "<tr>";
          Object.values(row).forEach(val => table += `<td>${highlight(val)}</td>`);
          table += "</tr>";
        });
        table += "</tbody></table>";
        container.innerHTML = table;
      } else if (currentSource === "drive") {
        renderFolder(container, data, true); // auto-expand root
      }
    }

    function renderFolder(container, folder, autoExpand=false) {
      const div = document.createElement("div");
      div.className = "folder";
      div.textContent = `📁 ${folder.name || "Unnamed"} (${(folder.files||[]).length} files)`;
      const treeDiv = document.createElement("div");
      treeDiv.className = "tree";
      treeDiv.style.display = autoExpand ? "block" : "none";

      div.onclick = () => {
        const allTrees = document.querySelectorAll(".tree");
        allTrees.forEach(t => t.style.display = "none");
        treeDiv.style.display = "block";
      };

      (folder.files||[]).forEach(file => {
        const fileDiv = document.createElement("div");
        fileDiv.className = "file";
        fileDiv.innerHTML = `${highlight(file.name)} - ${file.size} 
          <a href="${file.preview}" target="_blank">Preview</a> | 
          <a href="${file.download}" target="_blank" download>Download</a>`;
        treeDiv.appendChild(fileDiv);
      });

      (folder.subfolders||[]).forEach(sub => {
        renderFolder(treeDiv, sub);
      });

      container.appendChild(div);
      container.appendChild(treeDiv);
    }

    function highlight(text) {
      const q = document.getElementById("search").value.toLowerCase();
      if (!q) return text;
      try {
        const regex = new RegExp(`(${q})`, "gi");
        return String(text).replace(regex, '<span class="highlight">$1</span>');
      } catch {
        return text;
      }
    }

    function suggest() {
      const q = document.getElementById("search").value.toLowerCase();
      const list = document.getElementById("suggestions");
      list.innerHTML = "";
      if (!q || !fullData) return;
      let suggestions = [];
      if (currentSource === "sheet" && Array.isArray(fullData)) {
        suggestions = fullData.flatMap(row => Object.values(row))
          .filter(v => String(v).toLowerCase().includes(q))
          .slice(0,5);
      } else if (currentSource === "drive") {
        const gather = (f) => {
          (f.files||[]).forEach(file => {
            if (file.name.toLowerCase().includes(q)) suggestions.push(file.name);
          });
          (f.subfolders||[]).forEach(sub => gather(sub));
        };
        gather(fullData);
        suggestions = suggestions.slice(0,5);
      }
      suggestions.forEach(s => {
        const li = document.createElement("li");
        li.textContent = s;
        li.onclick = () => { document.getElementById("search").value = s; performSearch(); };
        list.appendChild(li);
      });
    }
  </script>
</body>
</html>
