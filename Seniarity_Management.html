<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="js/config.js"></script>
  <script>const PAGE_CONFIG = { title: 'NAD Seniority & Promotion Management', description: 'Search employee details, promotion timelines and seniority lists by token number.', canonical: '/Seniarity_Management' };</script>
  <script src="js/seo-injector.js"></script>
  <title>NAD Seniority & Promotion Management</title>
  <!-- Header + Footer CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/headerfooter.css">
  <!-- Font Awesome (for icons in footer) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS to load header/footer -->
  <script src="js/headerfooter.js" defer></script>
  <style>
    .sm-wrap { max-width: 900px; margin: 40px auto; padding: 0 20px 60px; }
    .sm-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; box-shadow: var(--shadow); }
    .sm-card h1 { font-size: 1.6rem; margin: 0 0 0.25rem; color: var(--text-primary); }
    .sm-card h3 { font-size: 1rem; font-weight: 600; margin: 1.5rem 0 0.5rem; color: var(--text-secondary); }
    .sm-card h4 { font-size: 1.1rem; margin: 1.5rem 0 0.75rem; color: var(--accent); }
    .sm-search { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .sm-search input { flex: 1; min-width: 200px; padding: 0.7rem 0.85rem; font-size: 0.95rem; border: 1px solid var(--border); border-radius: 8px; background: var(--primary-bg); color: var(--text-primary); }
    .sm-search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); }
    .sm-search button { padding: 0.7rem 1.5rem; font-weight: 600; color: #fff; background: var(--gradient); border: none; border-radius: 8px; cursor: pointer; transition: var(--transition); }
    .sm-search button:hover { opacity: 0.92; }
    #suggestions { border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); margin-bottom: 1rem; overflow: hidden; }
    #suggestions div { padding: 0.6rem 0.85rem; color: var(--text-primary); border-bottom: 1px solid var(--border); }
    #suggestions div:hover { background: var(--secondary-bg); }
    #employeeDetails table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    #employeeDetails th, #employeeDetails td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; font-size: 0.9rem; color: var(--text-primary); }
    #employeeDetails th { background: var(--secondary-bg); font-weight: 600; width: 40%; }
    #employeeDetails ul, #employeeDetails ol { padding-left: 1.4rem; color: var(--text-secondary); line-height: 1.8; }
    #employeeDetails p { color: var(--text-secondary); }
  </style>
</head>
<body>
    <!-- load header from page header.html - Header Placeholder -->
  <div id="header"></div>
  
  <div class="sm-wrap">
    <div class="sm-card">
      <h1>NAD Seniority & Promotion Management</h1>
      <h3>Search Employee</h3>
      <div class="sm-search">
        <input type="text" id="tokenInput" placeholder="Enter Token Number" oninput="showSuggestions()">
        <button onclick="searchEmployee()"><i class="fas fa-search"></i> Search</button>
      </div>
      <div id="suggestions" style="display:none;"></div>
      <div id="employeeDetails"></div>
    </div>
  </div>

<script>
// Links to published CSV exports
const sheet1URL = "https://docs.google.com/spreadsheets/d/1_qwciFgPC98jL9-4j4p7qLTK639xF0Gkrddp9E4bGQo/export?format=csv&gid=0";
const sheet2URL = "https://docs.google.com/spreadsheets/d/1_qwciFgPC98jL9-4j4p7qLTK639xF0Gkrddp9E4bGQo/export?format=csv&gid=378290522";

let employees = [];
let sanctionedPosts = [];
let headers1 = [];
let headers2 = [];

// Robust CSV parser
function parseCSV(text) {
  const rows = [];
  let row = [];
  let cell = "";
  let insideQuote = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    if (char === '"') {
      if (insideQuote && text[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        insideQuote = !insideQuote;
      }
    } else if (char === ',' && !insideQuote) {
      row.push(cell);
      cell = "";
    } else if ((char === '\n' || char === '\r') && !insideQuote) {
      if (cell || row.length) {
        row.push(cell);
        rows.push(row);
        row = [];
        cell = "";
      }
    } else {
      cell += char;
    }
  }
  if (cell || row.length) row.push(cell), rows.push(row);
  return rows;
}

// Load both sheets
async function loadData() {
  try {
    // Sheet1
    const res1 = await fetch(sheet1URL);
    const text1 = await res1.text();
    const rows1 = parseCSV(text1);
    headers1 = rows1[0];
    employees = rows1.slice(1).map(r => {
      let obj = {};
      headers1.forEach((h, i) => obj[h] = r[i] || "");
      return obj;
    });

    // Sheet2
    const res2 = await fetch(sheet2URL);
    const text2 = await res2.text();
    const rows2 = parseCSV(text2);
    headers2 = rows2[0];
    sanctionedPosts = rows2.slice(1).map(r => {
      let obj = {};
      headers2.forEach((h, i) => obj[h] = r[i] || "");
      return obj;
    });
  } catch (err) {
    console.error("Error loading sheets", err);
  }
}

// Autocomplete Suggestions
function showSuggestions() {
  const input = document.getElementById("tokenInput").value.trim().toLowerCase();
  const suggestionsDiv = document.getElementById("suggestions");
  suggestionsDiv.innerHTML = "";
  if (input.length < 2) {
    suggestionsDiv.style.display = "none";
    return;
  }
  const matches = employees.filter(e => (e["Tokan No."] || "").toLowerCase().includes(input)).slice(0, 5);
  matches.forEach(emp => {
    const div = document.createElement("div");
    div.textContent = `${emp["Tokan No."]} - ${emp["Name"]}`;
    div.style.cursor = "pointer";
    div.onclick = () => {
      document.getElementById("tokenInput").value = emp["Tokan No."];
      suggestionsDiv.style.display = "none";
      searchEmployee();
    };
    suggestionsDiv.appendChild(div);
  });
  suggestionsDiv.style.display = matches.length > 0 ? "block" : "none";
}

// Search Employee
function searchEmployee() {
  const token = document.getElementById("tokenInput").value.trim();
  const div = document.getElementById("employeeDetails");
  div.innerHTML = "";
  const emp = employees.find(e => e["Tokan No."] === token);
  if (!emp) {
    div.innerHTML = `<p>No employee found with token: ${token}</p>`;
    return;
  }
  div.innerHTML = `
    <h4>Employee Details</h4>
    <table border="1" cellpadding="5">
      ${headers1.map(h => `<tr><th>${h}</th><td>${emp[h]}</td></tr>`).join("")}
    </table>
    <h4>Promotion Timeline</h4>
    ${promotionTimeline(emp)}
    <h4>Seniority List</h4>
    ${showSeniority(emp)}
  `;
}

// Promotion Timeline (improved)
function promotionTimeline(emp) {
  const rankOrder = ["USL","SSK","Tradesman Mate","SK","HSK II","HSK I","MCM"];
  const idx = rankOrder.indexOf(emp["Rank"]);
  if (idx === -1) return "<p>Rank not in promotion ladder</p>";

  const retirementYear = new Date(emp["Date of Retirement"]).getFullYear();
  let html = "<ul>";

  for (let i = idx + 1; i < rankOrder.length; i++) {
    const nextRank = rankOrder[i];
    const vacancyInfo = sanctionedPosts.find(p => p["Rank"] === nextRank && p["Post"] === emp["Post"]);
    const sanctioned = vacancyInfo ? parseInt(vacancyInfo["Sactioned vacancy"]) || 0 : 0;

    let peers = employees.filter(e => e["Post"] === emp["Post"] && e["Rank"] === nextRank);
    peers.sort((a, b) => new Date(a[`Date of ${nextRank}`]) - new Date(b[`Date of ${nextRank}`]));

    const position = peers.findIndex(p => p["Tokan No."] === emp["Tokan No."]) + 1;
    const estimateYear = new Date().getFullYear() + Math.ceil(position / (sanctioned || 1));

    if (estimateYear <= retirementYear) {
      html += `<li>${nextRank} → Expected: ${estimateYear}</li>`;
    } else {
      html += `<li>${nextRank} → Not achievable before retirement (${retirementYear})</li>`;
      break;
    }
  }
  html += `<li>Retirement → ${retirementYear}</li>`;
  html += "</ul>";
  return html;
}

// Seniority List
function showSeniority(emp) {
  const peers = employees.filter(e => e["Post"] === emp["Post"] && e["Rank"] === emp["Rank"]);
  peers.sort((a, b) => new Date(a[`Date of ${emp["Rank"]}`]) - new Date(b[`Date of ${emp["Rank"]}`]));

  let html = "<ol>";
  peers.forEach(p => {
    const highlight = p["Tokan No."] === emp["Tokan No."] ? "style='background:var(--accent-light);color:var(--text-primary);'" : "";
    html += `<li ${highlight}>${p["Tokan No."]} - ${p["Name"]}</li>`;
  });
  html += "</ol>";
  return html;
}

window.onload = loadData;
</script>

    <!-- load footer from page footer.html -Footer Placeholder -->
    <div id="footer"></div>
</body>
</html>
